[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn codelearn_lms.wsgi --bind 0.0.0.0:$PORT --log-file -"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
