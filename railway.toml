[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "gunicorn codelearn_lms.wsgi --log-file -"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[healthcheck]]
path = "/api/"
timeout = 100
interval = 30
