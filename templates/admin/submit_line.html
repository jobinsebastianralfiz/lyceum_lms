{% load i18n admin_urls %}
<div class="submit-row">
    {% if show_save %}<input type="submit" value="{% trans 'Save' %}" class="default" name="_save">{% endif %}
    {% if show_delete_link %}
        <p class="deletelink-box">
            <a href="{% url opts|admin_urlname:'delete' original.pk|admin_urlquote %}" class="deletelink">{% trans "Delete" %}</a>
        </p>
    {% endif %}
    {% if show_save_as_new %}<input type="submit" value="{% trans 'Save as new' %}" name="_saveasnew">{% endif %}
    {% if show_save_and_add_another %}<input type="submit" value="{% trans 'Save and add another' %}" name="_addanother">{% endif %}
    {% if show_save_and_continue %}<input type="submit" value="{% trans 'Save and continue editing' %}" name="_continue">{% endif %}
</div>

<style>
    .submit-row {
        background: #f8fafc;
        padding: 20px 24px;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        align-items: center;
        margin: 0;
    }
    
    .submit-row input[type="submit"],
    .submit-row .button {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
        font-size: 0.875rem;
        border: 2px solid transparent;
    }
    
    .submit-row input[type="submit"]:hover,
    .submit-row .button:hover {
        background: linear-gradient(135deg, #3730a3 0%, #6b21a8 100%);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }
    
    .submit-row input[type="submit"].default {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 2px 4px rgba(16, 185, 129, 0.4);
    }
    
    .submit-row input[type="submit"].default:hover {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.6);
    }
    
    .submit-row .deletelink-box {
        margin: 0;
    }
    
    .submit-row .deletelink {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        font-size: 0.875rem;
        display: inline-block;
    }
    
    .submit-row .deletelink:hover {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        color: white;
    }
    
    /* Icons for buttons */
    .submit-row input[type="submit"][name="_save"]::before {
        content: "💾 ";
        margin-right: 4px;
    }
    
    .submit-row input[type="submit"][name="_saveasnew"]::before {
        content: "📄 ";
        margin-right: 4px;
    }
    
    .submit-row input[type="submit"][name="_addanother"]::before {
        content: "➕ ";
        margin-right: 4px;
    }
    
    .submit-row input[type="submit"][name="_continue"]::before {
        content: "✏️ ";
        margin-right: 4px;
    }
    
    .submit-row .deletelink::before {
        content: "🗑️ ";
        margin-right: 4px;
    }
    
    @media (max-width: 768px) {
        .submit-row {
            flex-direction: column;
            gap: 8px;
        }
        
        .submit-row input[type="submit"],
        .submit-row .deletelink {
            width: 100%;
            text-align: center;
        }
    }
</style>
